name: Tests

on:
  - push
  - pull_request

env:
  GOPATH: ${{ github.workspace }}/go
  GOVERSION: "1.22.2"

permissions:
  contents: read

jobs:
  # This job is a copy of the test-and-verify job, but adapted to run tests only on code from the
  # gridscale fork. The idea is to have at least a bit of coverage on gridscale specific code, because the other
  # providers are likely broken because of the forks changes.
  test-gridscale:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v2
        with:
          go-version: '${{ env.GOVERSION }}'

      - uses: actions/checkout@v2
        with:
          path: ${{ env.GOPATH }}/src/k8s.io/autoscaler

      - name: Test cloudprovider/gridscale
        working-directory: ${{ env.GOPATH }}/src/k8s.io/autoscaler/cluster-autoscaler/cloudprovider/gridscale
        run: go test ./...
      - name: Test utils/taints
        working-directory: ${{ env.GOPATH }}/src/k8s.io/autoscaler/cluster-autoscaler/utils/taints
        run: go test ./...

  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v2
        with:
          go-version: '${{ env.GOVERSION }}'

      - uses: actions/checkout@v2
        with:
          path: ${{ env.GOPATH }}/src/k8s.io/autoscaler

      - name: Apt-get
        run: sudo apt-get install libseccomp-dev -qq

      - name: Prepare
        working-directory: ${{ env.GOPATH }}/src/k8s.io/autoscaler
        run: hack/install-verify-tools.sh
        env:
          GO111MODULE: auto

      - name: Verify
        working-directory: ${{ env.GOPATH }}/src/k8s.io/autoscaler
        run: hack/verify-all.sh -v
        env:
          GO111MODULE: auto

      - name: Test
        working-directory: ${{ env.GOPATH }}/src/k8s.io/autoscaler
        run: hack/for-go-proj.sh test
        env:
          GO111MODULE: auto
